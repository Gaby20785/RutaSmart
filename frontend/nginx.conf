server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker: si el backend se reinicia y cambia de IP, nginx la vuelve a resolver
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA: cualquier ruta del frontend sirve index.html
    location / {
        try_files $uri /index.html;
    }
}
